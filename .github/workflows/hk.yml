name: Lint

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  hk-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'auto/runtime-version-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: jdx/mise-action@4444d8fd7a1b92f1821c12f435db40f58b743d26 # v4.0.1
        with:
          version: 2026.6.6
          install: false
      - name: Install lint tools
        run: |
          mise plugin install nix https://github.com/jbadeau/mise-nix.git
          mise install hk actionlint hadolint pkl shellcheck shfmt tombi typos nix:nixfmt
      - name: Run hk across entire repo
        run: hk check -a
      - name: Test container machine lifecycle helpers
        run: bash tests/container-machine-lifecycle.sh
