name: Build Builder Image

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-builder-image.yml
      - images/builder/Containerfile
      - modules/runtime-versions.nix

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'RobertDeRose/nix-hex-box'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve image metadata
        id: image
        run: |
          set -euo pipefail
          repository=$(nix eval --raw --expr '(import ./modules/runtime-versions.nix).builderImage.repository')
          version=$(nix eval --raw --expr '(import ./modules/runtime-versions.nix).builderImage.version')
          release_tag=$(nix eval --raw --expr '(import ./modules/runtime-versions.nix).builderImage.releaseTag')
          lix_version=$(nix eval --raw --expr '(import ./modules/runtime-versions.nix).builderImage.lixVersion')
          if [ -z "$repository" ] || [ -z "$version" ] || [ -z "$release_tag" ] || [ -z "$lix_version" ]; then
            echo 'failed to resolve builder image metadata' >&2
            exit 1
          fi
          {
            echo "repository=$repository"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "lix_version=$lix_version"
            echo 'tags<<EOF'
            echo "$repository:$version"
            if [ "${GITHUB_EVENT_NAME:-}" != schedule ]; then
              echo "$repository:$release_tag"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/builder
          file: images/builder/Containerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            LIX_VERSION=${{ steps.image.outputs.lix_version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HexBox Lix remote builder image
            org.opencontainers.image.version=${{ steps.image.outputs.release_tag }}
