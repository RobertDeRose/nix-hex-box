name: Update Runtime Versions

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.update-pr.outputs.pr_number }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.ROBBORG_CLIENT_ID }}
          private-key: ${{ secrets.ROBBORG_PRIVATE_KEY }}
        continue-on-error: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for runtime updates
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/update-runtime-versions.sh

      - name: Verify module evaluates
        if: steps.check.outputs.updated == 'true'
        run: nix eval --json '.#darwinModules' --apply builtins.attrNames

      - id: update-pr
        name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APPLE_UPDATED: ${{ steps.check.outputs.apple_updated }}
          APPLE_VERSION: ${{ steps.check.outputs.apple_version }}
          CURRENT_APPLE_VERSION: ${{ steps.check.outputs.current_apple_version }}
          SOCKTAINER_UPDATED: ${{ steps.check.outputs.socktainer_updated }}
          SOCKTAINER_VERSION: ${{ steps.check.outputs.socktainer_version }}
          CURRENT_SOCKTAINER_VERSION: ${{ steps.check.outputs.current_socktainer_version }}
          NIX_UPDATED: ${{ steps.check.outputs.nix_updated }}
          NIX_VERSION: ${{ steps.check.outputs.nix_version }}
          CURRENT_NIX_VERSION: ${{ steps.check.outputs.current_nix_version }}
        run: |
          set -euo pipefail

          branch=auto/runtime-version-update
          subject='${{ steps.check.outputs.subject }}'

          body_file=$(mktemp)
          {
            printf '%s\n' 'Automated update of default runtime versions.'
            printf '\n'
            if [ "$APPLE_UPDATED" = 'true' ]; then
              printf '%s\n' "- Apple Container: \`${CURRENT_APPLE_VERSION}\` -> \`${APPLE_VERSION}\`"
            fi
            if [ "$SOCKTAINER_UPDATED" = 'true' ]; then
              printf '%s\n' "- Socktainer: \`${CURRENT_SOCKTAINER_VERSION}\` -> \`${SOCKTAINER_VERSION}\`"
            fi
            if [ "$NIX_UPDATED" = 'true' ]; then
              printf '%s\n' "- nixos/nix: \`${CURRENT_NIX_VERSION}\` -> \`${NIX_VERSION}\`"
            fi
          } > "$body_file"

          git config user.name "robborg-the-creator[bot]"
          git config user.email "280037799+robborg-the-creator[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add modules/runtime-versions.nix .github/scripts/update-runtime-versions.sh

          if git diff --cached --quiet; then
            echo "Runtime versions already match the latest upstream releases"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "$subject"

          remote_branch_sha="$(git ls-remote --heads origin "$branch" | awk '{print $1}')"
          if [ -n "$remote_branch_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_branch_sha" --set-upstream origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          pr_number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$subject" --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" --title "$subject" --body-file "$body_file"
            pr_number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  hk-runtime:
    needs: update
    if: needs.update.outputs.pr_number != ''
    uses: ./.github/workflows/hk.yml
    with:
      ref: auto/runtime-version-update

  merge-runtime-pr:
    needs:
      - update
      - hk-runtime
    if: needs.update.outputs.pr_number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: runtime-version-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        continue-on-error: true
        with:
          client-id: ${{ secrets.ROBBORG_CLIENT_ID }}
          private-key: ${{ secrets.ROBBORG_PRIVATE_KEY }}

      - name: Merge runtime version PR with Robborg
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.update.outputs.pr_number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --admin --squash

      - name: Merge runtime version PR with workflow token
        if: steps.app-token.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update.outputs.pr_number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash
