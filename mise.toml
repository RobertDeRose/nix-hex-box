# schema
[settings]
experimental = true
env_shell_expand = true

[tools]
argc = "latest"
actionlint = "latest"
hadolint = "latest"
hk = { version = "1.41", arch = "aarch64" }
node = "lts"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
"npm:@commitlint/cli" = "20.5.3"
"npm:semantic-release" = "25.0.3"
"npm:conventional-changelog-conventionalcommits" = "9.3.1"
"npm:@semantic-release/commit-analyzer" = "13.0.1"
"npm:@semantic-release/github" = "12.0.6"
"npm:@semantic-release/release-notes-generator" = "14.1.0"
"pipx:commitizen" = "latest"
"aqua:Mic92/nixfmt-rs" = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"

[tasks."docs:build"]
description = "Build the Docusaurus documentation site"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

cd docs
npm ci --no-audit --no-fund
npm run build
'''

[tasks."docs:serve"]
description = "Serve the documentation site locally with hot-reload"
quiet = true
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

PORT="${usage_port:-3000}"

cd docs
npm ci --no-audit --no-fund
npm start -- --port "$PORT"
'''

[tasks."pages:build"]
description = "Assemble the GitHub Pages site: the product page with the docs under docs/"
depends = ["docs:build"]
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

rm -rf _site
cp -R site _site
cp -R docs/build _site/docs
'''

[tasks."pages:serve"]
description = "Serve the assembled Pages site at its GitHub Pages path"
depends = ["pages:build"]
quiet = true
usage = 'arg "[port]" help="Port to serve on" default="8000"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

PORT="${usage_port:-8000}"

# GitHub Pages serves this project under /nix-hex-box/, and the docs depend on that base path.
preview=$(mktemp -d)
trap 'rm -rf "$preview"' EXIT
ln -s "$PWD/_site" "$preview/nix-hex-box"
echo "Serving http://localhost:$PORT/nix-hex-box/"
python3 -m http.server "$PORT" --bind 127.0.0.1 --directory "$preview"
'''
